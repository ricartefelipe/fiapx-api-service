spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false

app:
  rabbitmq:
    exchange: fiapx.events
    routing-key-video-requested: video.requested
    routing-key-video-completed: video.completed
    routing-key-video-failed: video.failed
    queue-completed: video.api.completed
    queue-failed: video.api.failed
  storage:
    upload-dir: ${java.io.tmpdir}/fiapx-test/uploads
    output-dir: ${java.io.tmpdir}/fiapx-test/output
